<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Verby</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f4f4f5;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
    .box{width:min(420px,92vw);background:#111114;border:1px solid #2a2a32;border-radius:18px;padding:28px}
    h1{margin:0 0 8px} p{color:#a1a1aa}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid #2a2a32;background:#1a1a22;color:#fff;margin:6px 0}
    button,.oauth{width:100%;padding:12px;border-radius:12px;border:0;margin-top:8px;font-weight:700;cursor:pointer}
    .p{background:#8b5cf6;color:#fff}
    .oauth{background:#1a1a22;color:#fff;border:1px solid #2a2a32;display:block;text-align:center;text-decoration:none}
    a{color:#a78bfa}
  </style>
</head>
<body>
  <div class="box">
    <h1>Verby Login</h1>
    <p>OAuth folgt über Google / Apple / Microsoft. Bis dahin lokaler Demo-Login.</p>
    <input id="email" placeholder="E-Mail">
    <input id="name" placeholder="Name">
    <button class="p" onclick="login()">Weiter</button>
    <a class="oauth" href="#" onclick="demo('Google');return false;">Mit Google</a>
    <a class="oauth" href="#" onclick="demo('Apple');return false;">Mit Apple</a>
    <a class="oauth" href="#" onclick="demo('Microsoft');return false;">Mit Microsoft</a>
    <p style="font-size:12px">Echtes OAuth braucht Google Cloud / Apple Developer / Azure App + Supabase. Demo speichert nur lokal.</p>
    <p><a href="index.html">Zurück</a></p>
  </div>
  <script>
    function demo(p){ document.getElementById('email').value = p.toLowerCase()+'@verby.app'; document.getElementById('name').value = p+' User'; login(); }
    function login(){
      const email = document.getElementById('email').value.trim();
      const name = document.getElementById('name').value.trim() || 'Gast';
      if(!email) return alert('E-Mail eingeben');
      localStorage.setItem('verby_user', JSON.stringify({email,name,ts:Date.now()}));
      location.href = 'app.html';
    }
  </script>
</body>
</html>
